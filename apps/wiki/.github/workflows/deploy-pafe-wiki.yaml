name: Deploy a Cloudflare Pages

# Publica la wiki destilada. Mismo patrón que singular-solving-propuesta:
# build local del sitio + `wrangler pages deploy`, con Basic Auth en
# functions/_middleware.js.
#
# Requiere en este repositorio los secrets CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID, y en el proyecto de Pages el secret SITE_PASSWORD.
# Ver DEPLOY.md.

on:
  push:
    branches: [destilado]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Los workflows heredados del upstream de Quartz se guardan con esta misma
    # condición; aquí se invierte para no ejecutarse en el repo original.
    if: ${{ github.repository != 'jackyzha0/quartz' }}
    runs-on: ubuntu-latest
    name: Build y deploy de la wiki
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quartz usa el historial para las fechas de las notas

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # El toolkit y el Quartz que fija se descargan una vez por SHA; sin esta caché
      # cada build volvería a clonar los 44 plugins de la comunidad.
      - name: Caché del toolkit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pafe-wiki-okf
          key: okf-${{ hashFiles('okf/quartz-okf.ref') }}
          restore-keys: okf-

      # El toolkit regenera los índices, construye y verifica: los suelos están en
      # okf.config.mjs.
      - name: Build y verificación con quartz-okf
        run: bash okf/build-site.sh

      # Idempotente: si el proyecto ya existe, el comando falla y se ignora.
      - name: Asegurar que el proyecto de Pages existe
        run: >-
          npx --yes wrangler@latest pages project create pafe-wiki
          --production-branch destilado
          || echo "el proyecto ya existía"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # La contraseña del Basic Auth se guarda una sola vez como secret de este
      # repositorio y se propaga al proyecto de Pages, para no gestionarla en dos
      # sitios. Sin ella, el middleware responde 503 y el sitio no queda abierto.
      - name: Propagar SITE_PASSWORD al proyecto de Pages
        run: |
          if [ -z "${SITE_PASSWORD:-}" ]; then
            echo "::warning::SITE_PASSWORD no está configurado como secret; el sitio"
            echo "::warning::responderá 503 hasta que se defina en el proyecto de Pages."
            exit 0
          fi
          printf '%s' "$SITE_PASSWORD" |
            npx --yes wrangler@latest pages secret put SITE_PASSWORD \
              --project-name pafe-wiki
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Deploy a Cloudflare Pages
        run: >-
          npx --yes wrangler@latest pages deploy public
          --project-name pafe-wiki
          --branch destilado
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
