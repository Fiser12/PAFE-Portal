# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Wiki PAFE
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # Sin telemetría: el sitio es interno y va tras Basic Auth; no se envían las
  # URL de las notas a un tercero. Reactívalo si se decide medir uso.
  analytics: null
  locale: es-ES
  # Dominio del despliegue en Cloudflare Pages: de él dependen los enlaces
  # absolutos, el sitemap y el RSS. Cámbialo si se pone un dominio propio.
  baseUrl: pafe-wiki.pages.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "github:quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "github:quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "github:quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "github:quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "github:quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "github:quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "github:quartz-community/description"
    enabled: true
    order: 70
  - source: "github:quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "github:quartz-community/citations"
    enabled: false
    order: 85
  - source: "github:quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "github:quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "github:quartz-community/roam"
    enabled: false
    order: 92
  - source: "github:quartz-community/fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "github:quartz-community/remove-draft"
    enabled: true
  - source: "github:quartz-community/explicit-publish"
    enabled: false
  - source: "github:quartz-community/alias-redirects"
    enabled: true
  - source: "github:quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "github:quartz-community/favicon"
    enabled: true
  - source: "github:quartz-community/og-image"
    enabled: true
  - source: "github:quartz-community/cname"
    enabled: true
  - source: "github:quartz-community/canvas-page"
    enabled: true
  - source: "github:quartz-community/content-page"
    enabled: true
  - source: "github:quartz-community/folder-page"
    enabled: true
  - source: "github:quartz-community/tag-page"
    enabled: true
  - source: "github:quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  # El grafo genérico no distingue los ocho tipos de nota ni los siete edges del set
  # cerrado, y en el panel derecho apenas cabe. Lo sustituye el explorador del toolkit:
  # su widget ocupa el sitio del grafo en el panel derecho y abre el grafo de
  # conocimiento propio sobre la página.
  - source: "github:quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "./quartz-okf"
    enabled: true
  - source: "./quartz-okf-explorer"
    enabled: true
    layout:
      position: right
      priority: 15
  # Radio de impacto: las relaciones tipadas de ESTA nota. Prioridad 60 para quedar
  # DEBAJO de la tabla de contenidos (30) y de los retroenlaces (50): es contexto de
  # consulta, y además va plegado.
  - source: ./quartz-okf-panels
    enabled: true
    layout:
      position: right
      priority: 60
      condition: not-index
  - source: "github:quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "github:quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "github:quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "github:quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "github:quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "github:quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "github:quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "github:quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "github:quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "github:quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "github:quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: "github:quartz-community/recent-notes"
    enabled: false
  - source: "github:quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "github:quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "github:quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "github:quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "github:quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: "github:quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
